name: API Tests CICD

on:
  push:
    branches: [ backend ]
  pull_request:
    branches: [ backend ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: python-backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Start FastAPI server
        working-directory: python-backend
        run: |
          uvicorn core.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run tests
        working-directory: python-backend
        env:
          PYTHONPATH: src
        run: pytest -q
